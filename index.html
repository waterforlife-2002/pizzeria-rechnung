<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzeria Rechnung</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 1100px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* Formular Styles */
        .form-panel {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-height: 90vh;
            overflow-y: auto;
        }

        .form-panel h2 {
            color: #667eea;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .items-section {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .item-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr auto;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .item-row input {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-success {
            background: #48bb78;
            color: white;
            width: 100%;
            font-size: 16px;
            margin-top: 20px;
        }

        .btn-success:hover {
            background: #38a169;
        }

        .btn-danger {
            background: #f56565;
            color: white;
            padding: 8px 12px;
        }

        .btn-add {
            background: #48bb78;
            color: white;
            margin-top: 10px;
        }

        /* Rechnungsvorschau */
        .preview-panel {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: auto;
            max-height: 90vh;
        }

        #invoice {
            background: white;
            padding: 15mm;
            border: 1px solid #e0e0e0;
            width: 210mm;
            height: 297mm;
            margin: 0 auto;
            transform-origin: top center;
            position: relative;
        }

        .invoice-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15mm;
            padding-bottom: 8mm;
            border-bottom: 2px solid #667eea;
        }

        .business-info h1 {
            color: #667eea;
            font-size: 18px;
            margin-bottom: 4mm;
        }

        .business-info p {
            color: #666;
            font-size: 9px;
            line-height: 1.4;
        }

        .invoice-meta {
            text-align: right;
        }

        .invoice-meta h2 {
            color: #333;
            font-size: 16px;
            margin-bottom: 3mm;
        }

        .invoice-meta p {
            color: #666;
            font-size: 9px;
            margin: 2mm 0;
        }

        .client-section {
            margin-bottom: 12mm;
        }

        .client-section h3 {
            color: #667eea;
            font-size: 10px;
            margin-bottom: 3mm;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .client-info {
            background: #f8f9ff;
            padding: 8mm;
            border-radius: 4mm;
            border-left: 3px solid #667eea;
        }

        .client-info p {
            margin: 2mm 0;
            color: #333;
            font-size: 9px;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin: 10mm 0;
        }

        .items-table thead {
            background: #667eea;
            color: white;
        }

        .items-table th {
            padding: 6mm;
            text-align: left;
            font-size: 9px;
            font-weight: 600;
        }

        .items-table td {
            padding: 6mm;
            border-bottom: 1px solid #e0e0e0;
            font-size: 9px;
            color: #333;
        }

        .items-table tbody tr:last-child td {
            border-bottom: none;
        }

        .items-table tbody tr:hover {
            background: #f8f9ff;
        }

        .text-right {
            text-align: right;
        }

        .totals-section {
            margin-top: 12mm;
            padding-top: 8mm;
            border-top: 2px solid #e0e0e0;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 5mm 8mm;
            margin: 2mm 0;
            border-radius: 3mm;
        }

        .total-row.subtotal {
            background: #f8f9ff;
        }

        .total-row.tax {
            background: #fff3cd;
        }

        .total-row.grand-total {
            background: #667eea;
            color: white;
            font-size: 12px;
            font-weight: 700;
        }

        .payment-info {
            background: #e8f5e9;
            padding: 6mm;
            border-radius: 4mm;
            margin-top: 10mm;
            border-left: 3px solid #48bb78;
        }

        .payment-info h4 {
            color: #2e7d32;
            margin-bottom: 4mm;
            font-size: 9px;
        }

        .payment-info p {
            color: #1b5e20;
            font-size: 8px;
            margin: 2mm 0;
        }

        .footer-section {
            position: absolute;
            bottom: 10mm;
            left: 15mm;
            right: 15mm;
            text-align: center;
            color: #666;
            font-size: 8px;
            border-top: 1px solid #e0e0e0;
            padding-top: 5mm;
        }

        .footer-section p {
            margin: 2mm 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Eingabeformular -->
        <div class="form-panel">
            <h2>📝 Rechnungsdaten eingeben</h2>
            
            <div class="form-group">
                <label>Rechnungsnummer</label>
                <input type="text" id="invoiceNumber" value="2026-001" oninput="updateInvoice()">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Rechnungsdatum</label>
                    <input type="date" id="invoiceDate" oninput="updateInvoice()">
                </div>
                <div class="form-group">
                    <label>Falligkeitsdatum</label>
                    <input type="date" id="dueDate" oninput="updateInvoice()">
                </div>
            </div>

            <div class="form-group">
                <label>Kundenname</label>
                <input type="text" id="customerName" placeholder="Max Mustermann" oninput="updateInvoice()">
            </div>

            <div class="form-group">
                <label>Kundenadresse</label>
                <textarea id="customerAddress" rows="3" placeholder="Musterstr. 123&#10;12345 Musterstadt" oninput="updateInvoice()"></textarea>
            </div>

            <div class="form-group">
                <label>Kunden-E-Mail</label>
                <input type="email" id="customerEmail" placeholder="kunde@email.de" oninput="updateInvoice()">
            </div>

            <div class="items-section">
                <h3 style="margin-bottom: 15px; color: #667eea;">Positionen</h3>
                <div id="itemsContainer">
                    <div class="item-row">
                        <input type="text" class="item-desc" placeholder="Pizza Margherita" oninput="updateInvoice()">
                        <input type="number" class="item-qty" placeholder="Menge" value="1" min="1" oninput="updateInvoice()">
                        <input type="number" class="item-price" placeholder="Preis (€)" step="0.01" oninput="updateInvoice()">
                        <input type="number" class="item-tax" placeholder="MwSt. %" value="19" oninput="updateInvoice()">
                        <button class="btn btn-danger" onclick="removeItem(this)">✕</button>
                    </div>
                </div>
                <button class="btn btn-add" onclick="addItem()">+ Position hinzufügen</button>
            </div>

            <div class="form-group">
                <label>Zahlungsbedingungen</label>
                <textarea id="paymentTerms" rows="2" placeholder="
